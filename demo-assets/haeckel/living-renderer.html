<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c" width="760" height="1090"></canvas>
<script>
// "Living painting" renderer for Haeckel, Discomedusae (plate 8).
// Every effect is periodic in LOOP seconds, so the video loops seamlessly,
// and the artwork itself never moves more than a few pixels, so the video
// stays aligned with the printed plate.
const LOOP = 8;
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
const vs = `attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; uv.y = 1.0-uv.y; gl_Position = vec4(p,0.,1.); }`;
const fs = `
precision highp float;
varying vec2 uv;
uniform sampler2D art;
uniform float ph;      // phase 0..2PI over the loop
uniform vec2 res;
const float PI = 3.14159265;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
// Bells: centre (uv), radius, phase offset.
const int NB = 4;
vec4 bell(int i){
  if (i == 0) return vec4(0.74, 0.11, 0.17, 0.0);   // big blue bell, top right
  if (i == 1) return vec4(0.22, 0.09, 0.13, 1.7);   // pink-blue bell, top left
  if (i == 2) return vec4(0.83, 0.47, 0.14, 3.1);   // golden bell, right
  return vec4(0.40, 0.68, 0.17, 4.4);               // flower-shaped bell, bottom
}
void main(){
  float aspect = res.x / res.y;
  vec2 q = uv;
  float glow = 0.0;
  // 1) Bell pulse: each bell gently contracts and relaxes (local zoom).
  for (int i = 0; i < NB; i++) {
    vec4 b = bell(i);
    vec2 d = (q - b.xy); d.x *= aspect;
    float r = length(d) / b.z;
    float w = exp(-r * r * 1.6);
    float pulse = sin(ph * 2.0 + b.w);          // 2 pulses per loop
    vec2 dd = (q - b.xy) * w * 0.022 * pulse;
    q -= dd;
    glow += w * (0.5 + 0.5 * pulse);
  }
  // 2) Tentacles drift in a slow current: smooth flow field, stronger lower down.
  float drift = smoothstep(0.05, 0.9, uv.y);
  vec2 flow = vec2(
    sin(uv.y * 23.0 + ph + sin(uv.x * 7.0 + ph)) ,
    cos(uv.x * 19.0 - ph + sin(uv.y * 5.0 - ph * 2.0)) * 0.5
  );
  q += flow * 0.0032 * drift;
  vec3 c = texture2D(art, q).rgb;
  float ink = smoothstep(0.92, 0.7, lum(c));   // 1 on the artwork, 0 on paper
  // 3) Bioluminescent glow on the bells, in their own colours.
  c += c * glow * 0.22 * ink;
  c += vec3(0.25, 0.55, 1.0) * glow * 0.05 * ink;
  // 4) Soft underwater caustics across the paper and the art.
  vec2 k = uv * vec2(aspect, 1.0) * 9.0;
  float caus = sin(k.x + sin(k.y * 0.8 + ph) * 1.6) * sin(k.y * 1.1 + sin(k.x * 0.7 - ph) * 1.6);
  caus = pow(abs(caus), 6.0);
  c *= 1.0 - 0.035 * (1.0 - ink);              // faint blue-grey water shade on paper
  c = mix(c, c * vec3(0.95, 0.98, 1.02), 1.0 - ink);
  c += vec3(0.6, 0.85, 1.0) * caus * 0.07;
  // 5) Plankton: tiny glowing particles rising and wrapping once per loop.
  vec3 part = vec3(0.0);
  for (int layer = 0; layer < 2; layer++) {
    float n = layer == 0 ? 26.0 : 15.0;
    vec2 g = vec2(uv.x * n * aspect, uv.y * n + ph / (2.0 * PI) * (layer == 0 ? 2.0 : 1.0) * n);
    vec2 cell = floor(g);
    vec2 f = fract(g) - 0.5;
    float h = hash(cell + float(layer) * 17.0);
    if (h > 0.82) {
      vec2 o = vec2(hash(cell + 3.1) - 0.5, hash(cell + 7.7) - 0.5) * 0.6;
      o.x += 0.12 * sin(ph + h * 40.0);
      float dist = length(f - o);
      float tw = 0.6 + 0.4 * sin(ph * 3.0 + h * 50.0);
      part += vec3(0.55, 0.85, 1.0) * smoothstep(0.09, 0.0, dist) * tw * (layer == 0 ? 0.45 : 0.65);
    }
  }
  // On the light paper: translucent teal specks; on the art: a light glint.
  float pk = clamp(length(part), 0.0, 1.0);
  c = mix(c, vec3(0.30, 0.62, 0.80), pk * 0.55 * (1.0 - ink));
  c = 1.0 - (1.0 - c) * (1.0 - part * 0.6 * ink);   // screen blend
  // 6) A slow diagonal light sweep, once per loop.
  float s = fract(ph / (2.0 * PI));
  float sweep = exp(-pow((uv.x + uv.y * 0.6 - (s * 2.6 - 0.5)) * 7.0, 2.0));
  c += vec3(0.9, 0.95, 1.0) * sweep * 0.06 * ink;
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
window.loadArt = (src) => new Promise((resolve) => {
  const img = new Image();
  img.onload = () => {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(gl.getUniformLocation(prog, 'art'), 0);
    gl.uniform2f(gl.getUniformLocation(prog, 'res'), canvas.width, canvas.height);
    resolve();
  };
  img.src = src;
});
window.renderFrame = (t) => {
  gl.uniform1f(gl.getUniformLocation(prog, 'ph'), (t / LOOP) * Math.PI * 2);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  return canvas.toDataURL('image/png');
};
</script>
</body>
</html>
